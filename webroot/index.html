<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>adbdLocked</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0d1117;color:#e6edf3;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center;padding:20px}
.box{max-width:320px}
h1{color:#58a6ff;font-size:20px;margin-bottom:12px}
p{color:#8b949e;font-size:13px;line-height:1.6;margin-bottom:16px}
a{display:block;padding:12px;background:#58a6ff;color:#0d1117;text-decoration:none;border-radius:10px;font-weight:600;font-size:14px}
a:active{opacity:.8}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:s .8s linear infinite;margin-bottom:12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
    <div class="spin" id="spin"></div>
    <h1>adbdLocked</h1>
    <p id="msg">正在检测服务状态...</p>
    <a id="btn" href="http://localhost:7777" target="_blank" style="display:none">打开控制面板</a>
</div>
<script>
(function(){
    fetch('http://localhost:7777/api/status',{signal:AbortSignal.timeout(3000)})
    .then(r=>r.json())
    .then(d=>{
        document.getElementById('spin').style.display='none';
        const mn={on:'开启',standby:'预备',off:'关闭'};
        document.getElementById('msg').textContent=`服务运行中 · 模式: ${mn[d.mode]||d.mode} · 设备: ${d.connected_count}台`;
        document.getElementById('btn').style.display='block';
    })
    .catch(()=>{
        document.getElementById('spin').style.display='none';
        document.getElementById('msg').textContent='服务未运行，请等待开机完成或重启设备';
    });
})();
</script>
</body>
</html>
