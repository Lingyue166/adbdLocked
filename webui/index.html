<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>adbdLocked</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--dim:#8b949e;--accent:#58a6ff;--green:#3fb950;--yellow:#d29922;--red:#f85149;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;padding-bottom:80px}
.header{text-align:center;padding:16px 0 12px}
.header h1{font-size:22px;font-weight:700;letter-spacing:2px;color:var(--accent)}
.header .sub{font-size:12px;color:var(--dim);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.card-title{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.status-bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.status-left{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.standby{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.dot.off{background:var(--red)}
.status-label{font-size:14px;font-weight:600}
.status-info{font-size:12px;color:var(--dim)}
.mode-group{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mode-btn{padding:12px 6px;border:2px solid var(--border);border-radius:var(--radius);background:transparent;color:var(--dim);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
.mode-btn:active{transform:scale(.97)}
.mode-btn.on{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.1)}
.mode-btn.standby{border-color:var(--yellow);color:var(--yellow);background:rgba(210,153,34,.1)}
.mode-btn.off{border-color:var(--red);color:var(--red);background:rgba(248,81,73,.1)}
.mode-desc{font-size:10px;font-weight:400;margin-top:3px;opacity:.7}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.row-label{flex:1}
.row-label .name{font-size:13px;font-weight:500}
.row-label .desc{font-size:11px;color:var(--dim);margin-top:2px}
.sw{position:relative;width:44px;height:26px;flex-shrink:0;margin-left:10px}
.sw input{opacity:0;width:0;height:0}
.sw .sl{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--border);border-radius:26px;transition:.2s}
.sw .sl::before{content:"";position:absolute;height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s}
.sw input:checked+.sl{background:var(--green)}
.sw input:checked+.sl::before{transform:translateX(18px)}
.input-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border)}
.input-row:last-child{border-bottom:none}
.input-row label{font-size:13px;font-weight:500;min-width:65px;flex-shrink:0}
.input-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;font-family:monospace;outline:none}
.input-row input:focus{border-color:var(--accent)}
.btn-sm{padding:9px 14px;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--accent);font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn-sm:active{background:var(--accent);color:var(--bg)}
.dev-item{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-family:monospace;font-size:12px}
.dev-item:last-child{border-bottom:none}
.dev-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;flex-shrink:0}
.dev-dot.c{background:var(--green)}.dev-dot.h{background:var(--dim)}
.dev-addr{flex:1;overflow:hidden;text-overflow:ellipsis}
.dev-act{display:flex;gap:4px;margin-left:6px}
.btn-i{width:28px;height:28px;border:1px solid var(--border);border-radius:6px;background:transparent;color:var(--dim);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.btn-i:active{background:var(--border);color:var(--text)}
.conn-row{display:flex;gap:6px;margin-top:10px}
.conn-row input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:13px;font-family:monospace;outline:none}
.conn-row input:focus{border-color:var(--accent)}
.btn-p{padding:9px 16px;border:none;border-radius:8px;background:var(--accent);color:var(--bg);font-size:13px;font-weight:600;cursor:pointer}
.btn-p:active{opacity:.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:12px;z-index:999;transition:transform .3s;max-width:85%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red);color:var(--red)}.toast.ok{border-color:var(--green);color:var(--green)}
.empty{text-align:center;padding:16px;color:var(--dim);font-size:12px}
@media(min-width:480px){body{max-width:420px;margin:0 auto}}
</style>
</head>
<body>
<div class="header"><h1>adbdLocked</h1><div class="sub">ADB 无线调试管理</div></div>
<div class="card"><div class="status-bar"><div class="status-left"><span class="dot off" id="dot"></span><span class="status-label" id="sLabel">加载中...</span></div><div class="status-info" id="sInfo">--</div></div></div>
<div class="card"><div class="card-title">运行模式</div><div class="mode-group"><button class="mode-btn" id="mOn" onclick="setMode('on')"><div>开启</div><div class="mode-desc">50s全量重连</div></button><button class="mode-btn" id="mSt" onclick="setMode('standby')"><div>预备</div><div class="mode-desc">5min最近设备</div></button><button class="mode-btn" id="mOf" onclick="setMode('off')"><div>关闭</div><div class="mode-desc">还原默认</div></button></div></div>
<div class="card"><div class="card-title">功能设置</div><div class="row"><div class="row-label"><div class="name">免配对码</div><div class="desc">电脑端输入任意配对码均可通过</div></div><label class="sw"><input type="checkbox" id="bypass" onchange="updCfg()"><span class="sl"></span></label></div><div class="row"><div class="row-label"><div class="name">局域网免电脑操作</div><div class="desc">随意验证码通过，无须电脑发起连接</div></div><label class="sw"><input type="checkbox" id="autoap" onchange="updCfg()"><span class="sl"></span></label></div><div class="input-row"><label>验证码</label><input type="text" id="code" placeholder="6位数字" maxlength="6" inputmode="numeric"><button class="btn-sm" onclick="setCode()">设置</button></div><div class="input-row"><label>配对端口</label><input type="number" id="port" placeholder="1024-65535" min="1024" max="65535" inputmode="numeric"><button class="btn-sm" onclick="setPort()">锁定</button></div></div>
<div class="card"><div class="card-title">设备管理</div><div id="devList"><div class="empty">暂无设备</div></div><div class="conn-row"><input type="text" id="connAddr" placeholder="IP:端口" inputmode="url"><button class="btn-p" onclick="connDev()">连接</button></div></div>
<div class="toast" id="toast"></div>
<script>
const API='/api/';
let cur='off';

// 使用 GET 参数发送请求（避免 POST body 问题）
async function api(path,params={}){
    const qs=new URLSearchParams(params).toString();
    const url=API+path+(qs?'?'+qs:'');
    try{const r=await fetch(url);return await r.json();}catch(e){return{error:e.message};}
}

async function refresh(){
    const d=await api('status');
    if(d.error)return;
    cur=d.mode;
    ['on','standby','off'].forEach(m=>{document.getElementById({on:'mOn',standby:'mSt',off:'mOf'}[m]).className='mode-btn'+(m===d.mode?' '+m:'');});
    document.getElementById('dot').className='dot '+(d.mode==='off'?'off':d.mode);
    const mn={on:'开启',standby:'预备',off:'关闭'};
    document.getElementById('sLabel').textContent=mn[d.mode]||d.mode;
    document.getElementById('sInfo').textContent=`屏幕:${d.screen_state==='on'?'亮':'灭'} | 设备:${d.connected_count}`;
    document.getElementById('bypass').checked=d.bypass_pairing===1;
    document.getElementById('autoap').checked=d.auto_approve===1;
    if(document.activeElement!==document.getElementById('code'))document.getElementById('code').value=d.custom_code||'';
    if(document.activeElement!==document.getElementById('port'))document.getElementById('port').value=d.custom_port||'';
    const c=document.getElementById('devList');
    const all=new Map();
    (d.connected_devices||[]).forEach(x=>all.set(x,'c'));
    (d.history_devices||[]).forEach(x=>{if(!all.has(x))all.set(x,'h');});
    if(!all.size){c.innerHTML='<div class="empty">暂无设备记录</div>';return;}
    let h='';
    all.forEach((s,a)=>{h+=`<div class="dev-item"><span class="dev-dot ${s}"></span><span class="dev-addr">${esc(a)}</span><div class="dev-act"><button class="btn-i" onclick="reconn('${esc(a)}')" title="重连">↻</button><button class="btn-i" onclick="disconn('${esc(a)}')" title="断开">✕</button></div></div>`;});
    c.innerHTML=h;
}

async function setMode(m){const r=await api('mode',{mode:m});if(r.ok){toast(`模式: ${m}`,'ok');refresh();}else toast(r.error||'失败','err');}
async function updCfg(){const b=document.getElementById('bypass').checked?1:0;const a=document.getElementById('autoap').checked?1:0;await api('config',{bypass_pairing:b,auto_approve:a});toast('已更新','ok');}
async function setCode(){const v=document.getElementById('code').value.trim();if(!v){await api('config',{custom_code:'clear'});toast('已清除','ok');return;}if(!/^\d{6}$/.test(v)){toast('验证码必须6位数字','err');return;}const r=await api('config',{custom_code:v});toast(r.ok?'已设置: '+v:'失败',r.ok?'ok':'err');}
async function setPort(){const v=document.getElementById('port').value.trim();if(!v){await api('config',{custom_port:'clear'});toast('已清除','ok');return;}const p=parseInt(v);if(isNaN(p)||p<1024||p>65535){toast('端口: 1024-65535','err');return;}const r=await api('config',{custom_port:String(p)});toast(r.ok?'端口: '+p:'失败',r.ok?'ok':'err');}
async function connDev(){const a=document.getElementById('connAddr').value.trim();if(!a){toast('请输入地址','err');return;}if(!/^\d{1,3}(\.\d{1,3}){3}:\d+$/.test(a)){toast('格式: IP:端口','err');return;}const r=await api('connect',{device:a});if(r.ok){toast('已连接','ok');document.getElementById('connAddr').value='';refresh();}else toast('失败: '+(r.result||''),'err');}
async function reconn(a){const r=await api('connect',{device:a});toast(r.ok?'重连成功':'重连失败',r.ok?'ok':'err');refresh();}
async function disconn(a){await api('disconnect',{device:a});toast('已断开','ok');refresh();}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let tt;function toast(m,t=''){const e=document.getElementById('toast');e.textContent=m;e.className='toast show '+t;clearTimeout(tt);tt=setTimeout(()=>{e.className='toast';},2500);}
document.addEventListener('DOMContentLoaded',()=>{refresh();setInterval(refresh,3000);});
</script>
</body>
</html>
